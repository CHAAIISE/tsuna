[workspace]
resolver = "2"
members = ["agent_vault", "signal_budget", "signal_budget/ed25519_verifier", "signal_budget/spending_limit_policy"]

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
