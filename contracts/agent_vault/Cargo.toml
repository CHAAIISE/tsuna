[package]
name = "agent-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
policy-registry = { path = "../policy_registry", default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
oracle-router = { path = "../oracle_router", features = ["testutils"] }
policy-registry = { path = "../policy_registry" }
