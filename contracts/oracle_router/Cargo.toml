[package]
name = "oracle-router"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Admin-forced prices for the testnet crash demo. Never enabled in a production build:
# without it the forcing functions are not compiled into the wasm.
demo = []
# Mock Reflector and Chainlink contracts for downstream unit tests.
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
