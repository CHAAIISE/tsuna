[package]
name = "passkey-account"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = "0.8.0"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
passkey-webauthn-verifier = { path = "webauthn_verifier" }
